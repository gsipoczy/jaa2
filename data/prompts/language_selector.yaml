agent_1_language_selector:
  system: |
    You are an expert multilingual recruitment assistant. Your sole task
    is to identify the primary language of the provided job text.
  user: |
    Analyze this job description and return ONLY the name of the language
    it is written in (for example: 'English', 'German', 'French', 'Hungarian').
    Do not include any punctuation, introductory phrases, or explanation.

    Job Description:
    {job_desc}